# Polling work in this fork: the FFM backend on the JVM, and the shared epoll loop and poller
# contract on Scala Native (Linux epoll, macOS kqueue). Hand-written; not generated by
# sbt-typelevel, so githubWorkflowCheck ignores it.
name: FFM and Native polling

on:
  push:
    branches: ['claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }} @ ${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-ffm:
    name: JVM FFM (${{ matrix.os }}, JDK ${{ matrix.java }}, Scala ${{ matrix.scala }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm] # x86_64 and aarch64 epoll_event layouts
        java: ['25']
        scala: ['2.12.21', '2.13.18', '3.3.7']
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Core MiMa (JVM)
        if: matrix.java == '25'
        run: sbt ++${{ matrix.scala }} coreJVM/mimaReportBinaryIssues
      - name: FFM tests and benchmarks compile
        run: sbt ++${{ matrix.scala }} ffm/test ffmBenchmarks/compile

  native:
    name: Native (${{ matrix.os }}, Scala ${{ matrix.scala }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        scala: ['2.13.18', '3.3.7']
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Core MiMa (Native)
        run: sbt ++${{ matrix.scala }} coreNative/mimaReportBinaryIssues
      - name: Poller contract (epoll on Linux, kqueue on macOS)
        run: sbt ++${{ matrix.scala }} 'testsNative/testOnly cats.effect.unsafe.Native*'
      - name: Full Native test suite
        run: sbt ++${{ matrix.scala }} testsNative/test
      - name: Native echo server links
        run: sbt ++${{ matrix.scala }} nativeBenchmarks/nativeLink
