# Polling work in this fork: the FFM backends on the JVM (epoll on Linux, kqueue on macOS, and
# kqueue through libkqueue on Linux), and the shared event loop and poller contract on Scala
# Native (Linux epoll, macOS kqueue). Hand-written; not generated by sbt-typelevel, so
# githubWorkflowCheck ignores it.
name: FFM and Native polling

on:
  push:
    branches: ['claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }} @ ${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-ffm:
    name: JVM FFM (${{ matrix.os }}, JDK ${{ matrix.java }}, Scala ${{ matrix.scala }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # x86_64 and aarch64 epoll_event layouts; macOS arm64 for kqueue
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        java: ['25']
        scala: ['2.12.21', '2.13.18', '3.3.7']
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Install libkqueue (runs the kqueue suites on Linux too)
        if: runner.os == 'Linux'
        # ubuntu-24.04 packages it, so that runner must run the kqueue suites (REQUIRE_KQUEUE makes
        # them fail rather than skip); newer images may not, and then they are skipped there
        run: |
          sudo apt-get update -qq
          if [ "${{ matrix.os }}" = ubuntu-24.04-arm ]; then
            sudo apt-get install -y -qq libkqueue0
            echo REQUIRE_KQUEUE=1 >> "$GITHUB_ENV"
          else
            sudo apt-get install -y -qq libkqueue0 ||
              echo "::warning::libkqueue is not packaged on this image; the FFM kqueue suites are skipped here"
          fi
      - name: Core MiMa (JVM)
        if: runner.os == 'Linux'
        run: sbt ++${{ matrix.scala }} coreJVM/mimaReportBinaryIssues
      - name: FFM tests and benchmarks compile
        run: sbt ++${{ matrix.scala }} ffm/test ffmBenchmarks/compile

  native:
    name: Native (${{ matrix.os }}, Scala ${{ matrix.scala }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        scala: ['2.13.18', '3.3.7']
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Core MiMa (Native)
        run: sbt ++${{ matrix.scala }} coreNative/mimaReportBinaryIssues
      - name: Poller contract (epoll on Linux, kqueue on macOS)
        run: sbt ++${{ matrix.scala }} 'testsNative/testOnly cats.effect.unsafe.Native*'
      - name: Full Native test suite
        run: sbt ++${{ matrix.scala }} testsNative/test
      - name: Native echo server links
        run: sbt ++${{ matrix.scala }} nativeBenchmarks/nativeLink

  echo-macos:
    name: Echo benchmark (macOS, Native kqueue vs tokio)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Build the Native echo server
        run: sbt ++2.13.18 nativeBenchmarks/nativeLink
      - name: Build the tokio echo server
        run: cargo build --release --manifest-path ffm-benchmarks/tokio-echo/Cargo.toml
      - name: Run
        run: |
          ffm-benchmarks/loadgen/portable-echo.sh echo-macos.jsonl native tokio
          python3 ffm-benchmarks/loadgen/summary.py echo-macos.jsonl >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: echo-macos
          path: echo-macos.jsonl
